name: Lint and Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read

jobs:
  basic-ci:
    name: run linting and testing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # https://docs.zizmor.sh
    # Audits every workflow in the repo and dependabot.yml for security flaws.
    # The action pins zizmor itself, so new rules arrive only with a Dependabot
    # bump, which merges only once they pass.
    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        min-severity: medium
        advanced-security: false
        annotations: true

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        version: "0.7.9"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Dependencies
      run: make install

    - name: Lint
      run: make lint

    - name: Test
      run: make test
