name: Lint and Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read

jobs:
  basic-ci:
    name: run linting and testing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # https://docs.zizmor.sh
    # Audits every workflow in the repo and dependabot.yml for security flaws.
    # The action pins zizmor itself, so new rules arrive only with a Dependabot
    # bump, which merges only once they pass.
    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        min-severity: medium
        advanced-security: false
        annotations: true

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.7.9"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Dependencies
      run: make install

    - name: Lint
      run: make lint

    - name: Test
      run: make test
